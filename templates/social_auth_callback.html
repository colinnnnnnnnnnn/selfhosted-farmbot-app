<!DOCTYPE html>
<html>
<head>
    <title>Authentication Success</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Authentication Successful!</h2>
        <p>Redirecting...</p>
    </div>

    <script>
        (function() {
            const token = '{{ token }}';
            const user = {{ user|safe }};
            
            // Redirect to frontend with token in URL hash (not query param for security)
            // The frontend will read this, store the token, and clear the URL
            const frontendUrl = 'http://localhost:3000';
            window.location.href = frontendUrl + '?auth_token=' + encodeURIComponent(token);
        })();
    </script>
</body>
</html>
